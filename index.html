<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#08080a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Routine">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<title>Routine</title>
<style>
  :root{
    --bg:#08080a;
    --card:#111114;
    --card-2:#17171c;
    --line:#232329;
    --line-2:#2e2e36;
    --text:#f2f2f4;
    --dim:#8d8d95;
    --faint:#54545c;
    --frueh:#e0a458;
    --spaet:#7d8fd6;
    --frei:#5fbf9b;
    --danger:#d6685f;
    --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
    --safe-top:env(safe-area-inset-top,0px);
    --safe-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;overscroll-behavior-y:none;}
  body{padding-bottom:calc(84px + var(--safe-bottom));}
  button{font-family:inherit;color:inherit;border:none;background:none;cursor:pointer;padding:0;}
  input,textarea{font-family:inherit;}
  .wrap{max-width:520px;margin:0 auto;padding:0 18px;}
  .num{font-variant-numeric:tabular-nums;}

  /* Header */
  header{padding-top:calc(var(--safe-top) + 24px);display:flex;align-items:flex-start;justify-content:space-between;gap:12px;}
  .eyebrow{font-size:11px;color:var(--faint);font-weight:700;letter-spacing:.14em;text-transform:uppercase;}
  .title{font-size:29px;font-weight:700;letter-spacing:-.03em;margin-top:5px;line-height:1;}
  .h-act{display:flex;align-items:center;gap:6px;margin-top:6px;}
  .h-btn{width:36px;height:36px;border-radius:12px;background:var(--card);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;color:var(--dim);}
  .h-btn:active{background:var(--card-2);}
  .h-btn.on{background:var(--text);border-color:var(--text);color:#000;}
  .h-btn svg{width:17px;height:17px;}

  /* Stat-Karten nebeneinander */
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px;}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 15px;}
  .card-lbl{font-size:10.5px;color:var(--faint);font-weight:700;letter-spacing:.12em;text-transform:uppercase;}
  .card-big{font-size:26px;font-weight:700;letter-spacing:-.03em;margin-top:6px;line-height:1;}
  .card-sub{font-size:11.5px;color:var(--dim);font-weight:600;margin-top:5px;}
  .ring-card{display:flex;align-items:center;gap:13px;}
  .ring{position:relative;flex:0 0 58px;height:58px;}
  .ring svg{transform:rotate(-90deg);width:58px;height:58px;}
  .ring-txt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:14px;font-weight:700;letter-spacing:-.04em;}

  /* Schicht-Chip + Switch */
  .chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;letter-spacing:.02em;}
  .dot{width:7px;height:7px;border-radius:50%;display:inline-block;}
  .switch{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;margin-top:12px;}
  .switch button{flex:1;padding:10px 4px;border-radius:10px;font-size:13px;font-weight:600;color:var(--dim);transition:all .15s;
    display:flex;align-items:center;justify-content:center;gap:6px;}
  .switch button.on{background:var(--card-2);color:var(--text);}
  .switch button.on .dot{box-shadow:0 0 0 3px rgba(255,255,255,.06);}

  .banner{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line-2);
    border-radius:14px;padding:12px 14px;margin-top:10px;font-size:12.5px;color:var(--dim);font-weight:500;line-height:1.4;}
  .banner b{color:var(--text);font-weight:700;}
  .banner button{flex:0 0 auto;background:var(--card-2);border-radius:10px;padding:9px 11px;font-size:12px;font-weight:700;color:var(--text);}

  /* Sektionen zum Einklappen */
  .sec{margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;}
  .sec-head{display:flex;align-items:center;gap:11px;padding:15px 16px;width:100%;text-align:left;}
  .sec-head:active{background:var(--card-2);}
  .sec-name{flex:1;font-size:15.5px;font-weight:700;letter-spacing:-.015em;}
  .sec-range{font-family:var(--mono);font-size:10.5px;color:var(--faint);letter-spacing:-.03em;margin-top:2px;font-weight:500;}
  .sec-count{font-size:12.5px;font-weight:700;color:var(--dim);letter-spacing:-.02em;}
  .sec-count.full{color:var(--text);}
  .sec-chev{color:var(--faint);display:flex;transition:transform .22s;}
  .sec.open .sec-chev{transform:rotate(180deg);}
  .sec-body{display:none;padding:0 16px 8px;}
  .sec.open .sec-body{display:block;}
  .sec-line{height:1px;background:var(--line);margin:0 16px;}

  /* Punkte */
  .itm{border-top:1px solid var(--line);}
  .itm:first-child{border-top:none;}
  .row{display:flex;align-items:center;gap:12px;padding:13px 0;}
  .chk{flex:0 0 22px;height:22px;border-radius:7px;border:2px solid var(--faint);
    display:flex;align-items:center;justify-content:center;transition:all .18s;}
  .chk svg{width:12px;height:12px;opacity:0;transform:scale(.4);transition:all .2s cubic-bezier(.34,1.56,.64,1);}
  .row.done .chk{background:var(--text);border-color:var(--text);}
  .row.done .chk svg{opacity:1;transform:scale(1);}
  .t{flex:0 0 38px;font-family:var(--mono);font-size:11.5px;color:var(--faint);letter-spacing:-.04em;font-weight:600;}
  .n{flex:1;font-size:15.5px;font-weight:500;letter-spacing:-.012em;min-width:0;}
  .row.done .n{color:var(--dim);text-decoration:line-through;text-decoration-color:var(--faint);}
  .row.done .t{color:var(--faint);}
  .badge{flex:0 0 auto;font-size:10.5px;font-weight:700;color:var(--faint);background:var(--card-2);
    border-radius:7px;padding:3px 6px;letter-spacing:-.02em;}
  .arrow{flex:0 0 auto;width:26px;height:26px;border-radius:9px;display:flex;align-items:center;justify-content:center;
    color:var(--faint);transition:transform .22s;}
  .arrow:active{background:var(--card-2);}
  .itm.open .arrow{transform:rotate(90deg);color:var(--dim);}
  .mv{flex:0 0 auto;width:24px;height:24px;border-radius:8px;background:var(--card-2);border:1px solid var(--line);
    color:var(--dim);display:flex;align-items:center;justify-content:center;}
  .mv:active{background:var(--line);color:var(--text);}
  .mv.off{opacity:.25;}
  .mv svg{width:12px;height:12px;}
  .sub .mv{width:21px;height:21px;border-radius:7px;}
  .minus{flex:0 0 auto;width:22px;height:22px;border-radius:50%;background:var(--danger);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:17px;line-height:1;font-weight:700;}

  .panel{display:none;padding:2px 0 14px 50px;}
  .itm.open .panel{display:block;}
  .sub{display:flex;align-items:flex-start;gap:10px;padding:8px 0;}
  .sub-chk{flex:0 0 16px;height:16px;border-radius:5px;border:2px solid var(--faint);margin-top:2px;
    display:flex;align-items:center;justify-content:center;}
  .sub-chk svg{width:9px;height:9px;opacity:0;}
  .sub.done .sub-chk{background:var(--dim);border-color:var(--dim);}
  .sub.done .sub-chk svg{opacity:1;}
  .sub-n{flex:1;font-size:13.5px;font-weight:500;color:var(--dim);line-height:1.35;}
  .sub.done .sub-n{text-decoration:line-through;color:var(--faint);}
  .sub-x{flex:0 0 auto;width:20px;height:20px;border-radius:50%;background:var(--danger);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:14px;line-height:1;font-weight:700;}
  .p-empty{font-size:12.5px;color:var(--faint);padding:6px 0 2px;}
  .p-note{font-size:12.5px;color:var(--dim);line-height:1.45;padding:6px 0 2px;border-left:2px solid var(--line-2);padding-left:10px;margin-top:6px;}
  .p-actions{display:flex;justify-content:flex-end;margin-top:8px;}
  .p-add{width:30px;height:30px;border-radius:10px;background:var(--card-2);border:1px solid var(--line);
    color:var(--dim);font-size:17px;line-height:1;display:flex;align-items:center;justify-content:center;}
  .p-add:active{background:var(--line);}
  .p-add.on{background:var(--text);border-color:var(--text);color:#000;}
  .quick{display:flex;gap:8px;margin-top:8px;}
  .quick input{flex:1;background:var(--bg);border:1px solid var(--line);border-radius:11px;
    padding:11px 12px;font-size:13.5px;color:var(--text);outline:none;}
  .quick input:focus{border-color:var(--line-2);}
  .quick button{flex:0 0 auto;background:var(--card-2);border-radius:11px;padding:0 14px;font-size:13px;font-weight:700;}
  .note-lbl{font-size:10px;color:var(--faint);font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin:14px 0 6px;}
  .note{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:11px 12px;
    font-size:13.5px;color:var(--text);outline:none;resize:vertical;min-height:44px;line-height:1.45;}
  .note:focus{border-color:var(--line-2);}

  .add{display:flex;align-items:center;justify-content:center;gap:8px;padding:14px;border:1px dashed var(--line-2);
    border-radius:16px;color:var(--dim);font-size:14px;font-weight:600;margin-top:12px;}
  .add:active{background:var(--card);}
  .empty{text-align:center;padding:34px 20px;color:var(--faint);font-size:13.5px;line-height:1.55;}

  /* Woche */
  .wk{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--card);border:1px solid var(--line);
    border-radius:16px;margin-top:9px;}
  .wk.today{border-color:var(--line-2);background:var(--card-2);}
  .wk-l{flex:1;min-width:0;}
  .wk-n{font-size:15px;font-weight:650;letter-spacing:-.015em;}
  .wk-s{font-size:11px;color:var(--faint);font-weight:600;margin-top:2px;font-family:var(--mono);letter-spacing:-.02em;}
  .pick{display:flex;gap:3px;background:var(--bg);border-radius:11px;padding:3px;}
  .pick button{padding:8px 9px;border-radius:8px;font-size:11.5px;font-weight:700;color:var(--faint);}
  .pick button.on{background:var(--card-2);color:var(--text);}

  /* Kalender */
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin:18px 0 4px;}
  .cal-month{font-size:16.5px;font-weight:700;letter-spacing:-.02em;}
  .cal-arrow{font-size:20px;color:var(--dim);padding:8px 14px;border-radius:11px;}
  .cal-arrow:active{background:var(--card);}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;}
  .dow{text-align:center;font-size:10px;color:var(--faint);font-weight:700;letter-spacing:.06em;padding:6px 0;}
  .cell{aspect-ratio:1;border-radius:12px;background:var(--card);border:1px solid var(--line);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:var(--faint);}
  .cell .cd{font-size:12.5px;font-weight:600;letter-spacing:-.02em;}
  .cell .cb{width:56%;height:3px;border-radius:2px;background:#26262c;overflow:hidden;}
  .cell .cb i{display:block;height:100%;border-radius:2px;background:var(--dim);}
  .cell.has .cd{color:var(--text);}
  .cell.full{background:var(--card-2);border-color:var(--line-2);}
  .cell.today{box-shadow:0 0 0 2px var(--line-2);}
  .cell.blank{background:transparent;border:none;}
  .cell.future{opacity:.28;}
  .cell.tap:active{filter:brightness(1.3);}
  .legend{display:flex;gap:16px;justify-content:center;margin-top:18px;font-size:11.5px;color:var(--dim);font-weight:600;}
  .hint{text-align:center;font-size:11px;color:var(--faint);margin-top:12px;}

  /* Statistik */
  .bars{display:flex;align-items:flex-end;gap:6px;height:112px;margin-top:14px;}
  .bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;}
  .bar i{display:block;width:100%;background:var(--card-2);border-radius:7px 7px 3px 3px;min-height:3px;transition:height .4s;}
  .bar.hi i{background:var(--text);}
  .bar span{display:block;text-align:center;font-size:9.5px;color:var(--faint);font-weight:700;margin-top:7px;letter-spacing:-.02em;}
  .hbar{display:flex;align-items:center;gap:11px;margin-top:12px;}
  .hbar .hl{flex:0 0 52px;font-size:12.5px;font-weight:700;}
  .hbar .ht{flex:1;height:9px;border-radius:5px;background:var(--card-2);overflow:hidden;}
  .hbar .ht i{display:block;height:100%;border-radius:5px;}
  .hbar .hv{flex:0 0 auto;font-size:12px;font-weight:700;color:var(--dim);letter-spacing:-.02em;}
  .rank{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);}
  .rank:first-child{border-top:none;}
  .rank .ri{flex:1;font-size:14px;font-weight:500;min-width:0;}
  .rank .rv{font-size:12.5px;font-weight:700;color:var(--dim);letter-spacing:-.02em;}
  .sec-title{font-size:11px;color:var(--faint);font-weight:700;letter-spacing:.14em;text-transform:uppercase;margin:26px 0 10px;}

  /* Nav */
  nav{position:fixed;bottom:0;left:0;right:0;background:rgba(8,8,10,.86);
    backdrop-filter:saturate(180%) blur(22px);-webkit-backdrop-filter:saturate(180%) blur(22px);
    border-top:1px solid var(--line);padding-bottom:var(--safe-bottom);z-index:50;}
  .nav-inner{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);}
  .tab{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:11px 0 9px;
    color:var(--faint);font-size:10px;font-weight:600;letter-spacing:-.01em;}
  .tab svg{width:20px;height:20px;}
  .tab.active{color:var(--text);}
  .nav-badge{position:absolute;top:8px;left:calc(50% + 8px);width:8px;height:8px;border-radius:50%;
    background:var(--danger);border:2px solid var(--bg);display:none;}
  .nav-badge.on{display:block;}

  /* Sheet */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);z-index:100;
    display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s;}
  .overlay.open{opacity:1;pointer-events:auto;}
  .sheet{background:var(--card);width:100%;max-width:520px;border-radius:26px 26px 0 0;
    padding:24px 18px calc(24px + var(--safe-bottom));transform:translateY(100%);
    transition:transform .28s cubic-bezier(.22,1,.36,1);border-top:1px solid var(--line-2);}
  .overlay.open .sheet{transform:translateY(0);}
  .sheet h3{margin:0 0 4px;font-size:19px;font-weight:700;letter-spacing:-.02em;}
  .sheet .sh-sub{font-size:12px;color:var(--faint);font-weight:600;margin-bottom:18px;}
  .field{margin-bottom:13px;}
  .field label{display:block;font-size:10.5px;color:var(--faint);font-weight:700;letter-spacing:.12em;
    text-transform:uppercase;margin-bottom:7px;}
  .field input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:13px;
    padding:14px;font-size:16px;color:var(--text);outline:none;}
  .field input:focus{border-color:var(--line-2);}
  .actions{display:flex;gap:10px;margin-top:18px;}
  .btn{flex:1;background:var(--text);color:#000;border-radius:14px;padding:15px;font-size:16px;font-weight:700;}
  .btn:active{filter:brightness(.88);}
  .btn-del{padding:15px 16px;font-size:15px;font-weight:600;color:var(--danger);}
  .scroll{max-height:60vh;overflow-y:auto;margin:0 -2px;padding:2px;}
  .drow{display:flex;align-items:center;gap:11px;padding:12px 13px;background:var(--card-2);
    border-radius:13px;margin-bottom:7px;}
  .drow .dt{font-family:var(--mono);font-size:11px;color:var(--faint);flex:0 0 36px;letter-spacing:-.04em;font-weight:600;}
  .drow .dn{flex:1;font-size:14.5px;font-weight:500;}
  .drow.miss .dn{color:var(--dim);}
  .drow .ds{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:0 0 auto;}
  .drow.done .ds{background:var(--text);}
  .dnote{font-size:12px;color:var(--dim);padding:2px 13px 12px;line-height:1.45;margin-top:-4px;}

  /* Settings */
  .srow{display:flex;align-items:center;gap:13px;background:var(--card);border:1px solid var(--line);
    border-radius:16px;padding:15px 16px;margin-bottom:9px;width:100%;text-align:left;}
  .srow:active{background:var(--card-2);}
  .sico{flex:0 0 auto;color:var(--dim);display:flex;}
  .sico svg{width:19px;height:19px;}
  .stxt{flex:1;min-width:0;}
  .st{font-size:15.5px;font-weight:600;letter-spacing:-.015em;}
  .ss{font-size:12px;color:var(--faint);margin-top:2px;}
  .srow.danger .st,.srow.danger .sico{color:var(--danger);}
  .snote{font-size:12px;color:var(--faint);line-height:1.6;margin-top:14px;padding:0 2px;}
  .alert{display:flex;gap:12px;align-items:flex-start;background:rgba(214,104,95,.09);
    border:1px solid rgba(214,104,95,.32);border-radius:16px;padding:14px 15px;margin-top:16px;}
  .alert .ad{flex:0 0 auto;width:8px;height:8px;border-radius:50%;background:var(--danger);margin-top:5px;}
  .alert .at{font-size:13px;line-height:1.45;font-weight:600;}
  .alert .as{color:var(--dim);font-size:12px;font-weight:500;margin-top:3px;}

  #toast{position:fixed;left:50%;bottom:calc(100px + var(--safe-bottom));
    transform:translateX(-50%) translateY(20px);background:var(--text);color:#000;font-size:13.5px;font-weight:700;
    padding:12px 20px;border-radius:30px;opacity:0;pointer-events:none;transition:all .25s;z-index:200;white-space:nowrap;}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  @media (prefers-reduced-motion:reduce){*{transition:none!important;}}
  .view{animation:fade .22s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:none;}}
</style>
</head>
<body>

<div class="view" id="view"></div>

<nav>
  <div class="nav-inner">
    <button class="tab active" data-tab="plan" onclick="switchTab('plan')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
      Heute
    </button>
    <button class="tab" data-tab="week" onclick="switchTab('week')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 10h18M8 2v4M16 2v4"/></svg>
      Woche
    </button>
    <button class="tab" data-tab="cal" onclick="switchTab('cal')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01"/></svg>
      Kalender
    </button>
    <button class="tab" data-tab="stats" onclick="switchTab('stats')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
      Statistik
    </button>
    <button class="tab" data-tab="settings" onclick="switchTab('settings')">
      <span class="nav-badge" id="nav-badge"></span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      Mehr
    </button>
  </div>
</nav>

<div class="overlay" id="overlay" onclick="if(event.target===this)closeSheet()">
  <div class="sheet" id="sheet"></div>
</div>

<input type="file" id="import-file" accept="application/json,.json" style="display:none">
<div id="toast"></div>

<script>
const STORE="routineV2";
const OLD="dayPlan_v1";
const SHIFTS={frueh:"Frühschicht", spaet:"Spätschicht", frei:"Frei"};
const SHORT={frueh:"Früh", spaet:"Spät", frei:"Frei"};
const COLOR={frueh:"var(--frueh)", spaet:"var(--spaet)", frei:"var(--frei)"};
const DAYS=["Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag","Sonntag"];
const BLOCKS=[["Morgen","04:00 – 11:59"],["Mittag","12:00 – 16:59"],["Abend","17:00 – 03:59"],["Ohne Zeit",""]];
const CHECK='<svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>';
const CHECK_S='<svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>';
const CHEV='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
const UP='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M18 15l-6-6-6 6"/></svg>';
const DOWN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
const PEN='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>';
const ARROW='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>';

let data=load();
let tab="plan";
let viewShift=null;
let editMode=false;
let openItem=null;
let addOpen=null;
let subEdit=null;
let calMonth=new Date();
let calScope="all";
let statRange=7;

function load(){
  try{ const d=JSON.parse(localStorage.getItem(STORE)); if(d&&d.plans) return migrate(d); }catch(e){}
  try{ const o=JSON.parse(localStorage.getItem(OLD)); if(o&&o.plans){ const m=migrate(o); localStorage.setItem(STORE,JSON.stringify(m)); return m; } }catch(e){}
  return { plans:{frueh:[],spaet:[],frei:[]}, week:{}, days:{}, meta:{}, ui:{} };
}
function migrate(d){
  const out={ plans:{frueh:[],spaet:[],frei:[]}, week:d.week||{}, days:d.days||{}, meta:d.meta||{}, ui:d.ui||{} };
  ["frueh","spaet","frei"].forEach(s=>{
    out.plans[s]=(d.plans&&d.plans[s]?d.plans[s]:[]).map(x=>({id:x.id,time:x.time||"",name:x.name,subs:x.subs||[]}));
  });
  for(const k in out.days){
    const day=out.days[k];
    if(!day.done) day.done={};
    if(!day.subDone) day.subDone={};
    if(!day.notes) day.notes={};
    if(!day.snap) day.snap=[];
  }
  return out;
}
function save(){ localStorage.setItem(STORE, JSON.stringify(data)); }
function dateKey(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function todayKey(){ return dateKey(new Date()); }
function wdIdx(d){ return (d.getDay()+6)%7; }
function keyToDate(k){ return new Date(k+"T00:00:00"); }

function shiftOf(key){
  const d=data.days[key];
  if(d&&d.shift) return d.shift;
  return data.week[wdIdx(keyToDate(key))]||"frueh";
}
function ensureDay(key){
  if(!data.days[key]) data.days[key]={ shift:shiftOf(key), done:{}, subDone:{}, notes:{}, snap:[] };
  const d=data.days[key];
  d.done=d.done||{}; d.subDone=d.subDone||{}; d.notes=d.notes||{}; d.snap=d.snap||[];
  return d;
}
function plan(s){
  return (data.plans[s]||[]).slice().sort((a,b)=>(a.time||"99:99").localeCompare(b.time||"99:99"));
}
function itemsOf(key){
  if(key===todayKey()) return plan(shiftOf(key));
  const d=data.days[key];
  return (d&&d.snap&&d.snap.length)? d.snap : [];
}
function infoOf(key,scope){
  if(scope&&scope!=="all"&&shiftOf(key)!==scope) return {done:0,total:0};
  const d=data.days[key], items=itemsOf(key);
  return { done: d? items.filter(i=>d.done[i.id]).length : 0, total: items.length };
}
function pctOf(key){ const c=infoOf(key,"all"); return c.total? c.done/c.total : 0; }
function dayComplete(key){ const c=infoOf(key,"all"); return c.total>0 && c.done===c.total; }
function streak(){
  let s=0, cur=new Date();
  if(!dayComplete(todayKey())) cur.setDate(cur.getDate()-1);
  while(dayComplete(dateKey(cur))){ s++; cur.setDate(cur.getDate()-1); }
  return s;
}
function bestStreak(){
  const keys=Object.keys(data.days).filter(dayComplete).sort();
  let best=0,run=0,prev=null;
  keys.forEach(k=>{
    if(prev){ const diff=(keyToDate(k)-keyToDate(prev))/86400000; run = diff===1? run+1 : 1; }
    else run=1;
    prev=k; if(run>best) best=run;
  });
  return best;
}
function blockOf(t){
  if(!t) return "Ohne Zeit";
  const h=parseInt(t.slice(0,2),10);
  if(h>=4&&h<12) return "Morgen";
  if(h<17) return "Mittag";
  return "Abend";
}
function currentBlock(){ return blockOf(String(new Date().getHours()).padStart(2,"0")+":00"); }
function isOpen(b){
  if(!data.ui.open) data.ui.open={};
  if(data.ui.open[b]===undefined) return b===currentBlock();
  return !!data.ui.open[b];
}
function toggleSec(b){
  if(!data.ui.open) data.ui.open={};
  data.ui.open[b]=!isOpen(b);
  save(); renderPlan();
}

function render(){
  if(tab==="cal") renderCal();
  else if(tab==="week") renderWeek();
  else if(tab==="stats") renderStats();
  else if(tab==="settings") renderSettings();
  else renderPlan();
}

/* ---------- Heute ---------- */
function ring(p){
  const v=Math.round(p*100);
  return `<div class="ring">
    <svg viewBox="0 0 40 40">
      <circle cx="20" cy="20" r="16" fill="none" stroke="var(--card-2)" stroke-width="4"/>
      <circle cx="20" cy="20" r="16" fill="none" stroke="var(--text)" stroke-width="4" stroke-linecap="round"
        pathLength="100" stroke-dasharray="${v} 100"/>
    </svg>
    <div class="ring-txt num">${v}%</div>
  </div>`;
}
function renderPlan(){
  const key=todayKey();
  const today=shiftOf(key);
  if(!viewShift) viewShift=today;
  const live=viewShift===today;
  const day=ensureDay(key);
  const items=plan(viewShift);
  const info=live? infoOf(key,"all") : {done:0,total:items.length};
  const pct=info.total? info.done/info.total : 0;

  let secs="";
  BLOCKS.forEach(([b,range])=>{
    const list=items.filter(i=>blockOf(i.time)===b);
    if(!list.length) return;
    const dn=live? list.filter(i=>day.done[i.id]).length : 0;
    const open=isOpen(b);
    let rows="";
    list.forEach(it=>{
      const done=live&&!!day.done[it.id];
      const subs=it.subs||[];
      const note=(day.notes[it.id]||"");
      const expanded=openItem===it.id;
      if(editMode){
        const gi=items.findIndex(x=>x.id===it.id);
        rows+=`<div class="itm">
          <div class="row">
            <button class="minus" onclick='event.stopPropagation();removeItem("${it.id}")'>&minus;</button>
            <div class="t">${esc(it.time||"—")}</div>
            <div class="n" onclick='editItem("${it.id}")'>${esc(it.name)}</div>
            <button class="mv ${gi===0?'off':''}" onclick='event.stopPropagation();moveItem("${it.id}",-1)'>${UP}</button>
            <button class="mv ${gi===items.length-1?'off':''}" onclick='event.stopPropagation();moveItem("${it.id}",1)'>${DOWN}</button>
            <button class="arrow" onclick='editItem("${it.id}")'>${ARROW}</button>
          </div></div>`;
        return;
      }
      let panel="";
      const showAdd = addOpen===it.id;
      const showDel = subEdit===it.id;
      const subRows=subs.map((s,si)=>{
        const sd=!!day.subDone[s.id];
        return `<div class="sub ${sd?'done':''}" onclick='toggleSub("${s.id}")'
          onpointerdown='lpStart("${it.id}","${s.id}")' onpointerup='lpEnd()' onpointercancel='lpEnd()' onpointerleave='lpEnd()'>
          <div class="sub-chk">${CHECK_S}</div>
          <div class="sub-n">${esc(s.name)}</div>
          ${showDel?`<button class="mv ${si===0?'off':''}" onclick='event.stopPropagation();moveSub("${it.id}","${s.id}",-1)'>${UP}</button>
          <button class="mv ${si===subs.length-1?'off':''}" onclick='event.stopPropagation();moveSub("${it.id}","${s.id}",1)'>${DOWN}</button>
          <button class="sub-x" onclick='event.stopPropagation();removeSub("${it.id}","${s.id}")'>&times;</button>`:''}
        </div>`;
      }).join("");
      panel=`<div class="panel">
        ${subRows||(showAdd?'':'<div class="p-empty">Noch keine Unterpunkte</div>')}
        ${(!showAdd&&note)?`<div class="p-note">${esc(note)}</div>`:''}
        ${showAdd?`<div class="quick">
            <input id="q-${it.id}" placeholder="Kleiner Punkt…" onkeydown='if(event.key==="Enter")addSub("${it.id}")'>
            <button onclick='addSub("${it.id}")'>+</button>
          </div>
          <div class="note-lbl">Notiz heute</div>
          <textarea class="note" placeholder="Was war los…" onchange='saveNote("${it.id}",this.value)'>${esc(note)}</textarea>`:''}
        <div class="p-actions">
          ${subs.length?`<button class="p-add ${showDel?'on':''}" onclick='toggleSubEdit("${it.id}")' aria-label="Unterpunkte löschen">${PEN}</button>`:''}
          <button class="p-add ${showAdd?'on':''}" onclick='toggleAdd("${it.id}")'>${showAdd?'&times;':'+'}</button>
        </div>
      </div>`;
      const subDone=subs.filter(s=>day.subDone[s.id]).length;
      rows+=`<div class="itm ${expanded?'open':''}">
        <div class="row ${done?'done':''}">
          <div class="chk" onclick='toggle("${it.id}")'>${CHECK}</div>
          <div class="t">${esc(it.time||"—")}</div>
          <div class="n" onclick='toggle("${it.id}")'>${esc(it.name)}</div>
          ${subs.length?`<span class="badge num">${subDone}/${subs.length}</span>`:(note?'<span class="badge">Notiz</span>':'')}
          <button class="arrow" onclick='toggleItem("${it.id}")'>${ARROW}</button>
        </div>
        ${panel}
      </div>`;
    });
    secs+=`<div class="sec ${open?'open':''}">
      <button class="sec-head" onclick="toggleSec('${b}')">
        <div style="flex:1;min-width:0">
          <div class="sec-name">${b}</div>
          ${range?`<div class="sec-range">${range}</div>`:''}
        </div>
        <div class="sec-count num ${live&&dn===list.length?'full':''}">${live?dn+"/"+list.length:list.length}</div>
        <span class="sec-chev">${CHEV}</span>
      </button>
      ${open?`<div class="sec-line"></div><div class="sec-body">${rows}</div>`:''}
    </div>`;
  });

  if(!items.length) secs=`<div class="empty">Der ${SHORT[viewShift]}-Plan ist leer.<br>Unten Punkt hinzufügen.</div>`;

  const sw=Object.keys(SHIFTS).map(s=>`<button class="${viewShift===s?'on':''}" onclick="setView('${s}')">
      <span class="dot" style="background:${COLOR[s]}"></span>${SHORT[s]}</button>`).join("");

  document.getElementById("view").innerHTML=`
    <div class="wrap">
      <header>
        <div>
          <div class="eyebrow">${new Date().toLocaleDateString("de-DE",{weekday:"long"})} · ${new Date().toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit"})}</div>
          <div class="title">Heute</div>
        </div>
        <div class="h-act">
          <button class="h-btn" onclick="location.reload()" aria-label="Neu laden"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6"/></svg></button>
          <button class="h-btn ${editMode?'on':''}" onclick="toggleEdit()" aria-label="Bearbeiten"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>
        </div>
      </header>

      <div class="grid2">
        <div class="card ring-card">
          ${ring(live?pct:0)}
          <div>
            <div class="card-lbl">Erledigt</div>
            <div class="card-sub num" style="font-size:14px;color:var(--text);margin-top:4px">${live?info.done:0} / ${info.total}</div>
          </div>
        </div>
        <div class="card">
          <div class="card-lbl">Streak</div>
          <div class="card-big num">${streak()}<span style="font-size:13px;color:var(--dim);font-weight:600;letter-spacing:0"> Tage</span></div>
          <div class="chip" style="margin-top:7px;color:var(--dim)"><span class="dot" style="background:${COLOR[today]}"></span>${SHIFTS[today]}</div>
        </div>
      </div>

      <div class="switch">${sw}</div>
      ${live?'':`<div class="banner"><span>Vorschau <b>${SHIFTS[viewShift]}</b> – heute ist ${SHIFTS[today]}.</span><button onclick="setShiftToday('${viewShift}')">Heute setzen</button></div>`}

      ${secs}
      <div class="add" onclick="addItem()">+ Punkt für ${SHORT[viewShift]}</div>
    </div>`;
}
function setView(s){ viewShift=s; openItem=null; addOpen=null; subEdit=null; renderPlan(); }
function setShiftToday(s){ const d=ensureDay(todayKey()); d.shift=s; viewShift=s; save(); buzz(); renderPlan(); }

/* ---------- Punkte / Unterpunkte ---------- */
function toggle(id){
  const key=todayKey(), day=ensureDay(key);
  if(viewShift!==shiftOf(key)) return;
  day.shift=shiftOf(key);
  day.done[id]=!day.done[id];
  snapshot(day);
  buzz(); save(); renderPlan();
}
function toggleItem(id){ openItem = openItem===id? null : id; if(openItem!==id){ addOpen=null; subEdit=null; } renderPlan(); }
function toggleSubEdit(id){
  subEdit = subEdit===id? null : id;
  openItem=id; renderPlan();
}
function toggleAdd(id){
  addOpen = addOpen===id? null : id;
  openItem=id; renderPlan();
  if(addOpen===id) setTimeout(()=>{ const i=document.getElementById("q-"+id); if(i) i.focus(); },60);
}
let lpT=null, lpFired=false;
function lpStart(itemId,sid){
  lpFired=false;
  clearTimeout(lpT);
  lpT=setTimeout(()=>{
    lpFired=true; buzz();
    const it=(data.plans[viewShift]||[]).find(x=>x.id===itemId);
    const sub=it&&(it.subs||[]).find(x=>x.id===sid);
    if(sub&&confirm("„"+sub.name+"“ löschen?")) removeSub(itemId,sid);
  },550);
}
function lpEnd(){ clearTimeout(lpT); }
function toggleSub(sid){
  if(lpFired){ lpFired=false; return; }
  const day=ensureDay(todayKey());
  day.subDone[sid]=!day.subDone[sid];
  snapshot(day); buzz(); save(); renderPlan();
}
function addSub(itemId){
  const inp=document.getElementById("q-"+itemId);
  const v=(inp.value||"").trim(); if(!v) return;
  const it=data.plans[viewShift].find(x=>x.id===itemId); if(!it) return;
  it.subs=it.subs||[]; it.subs.push({id:uid(),name:v});
  openItem=itemId; addOpen=itemId; save(); renderPlan();
  setTimeout(()=>{ const i=document.getElementById("q-"+itemId); if(i) i.focus(); },60);
}
function removeSub(itemId,sid){
  const it=data.plans[viewShift].find(x=>x.id===itemId); if(!it) return;
  it.subs=(it.subs||[]).filter(s=>s.id!==sid);
  openItem=itemId; if((it.subs||[]).length) subEdit=itemId; else subEdit=null;
  save(); renderPlan();
}
function moveSub(itemId,sid,dir){
  const it=data.plans[viewShift].find(x=>x.id===itemId); if(!it||!it.subs) return;
  const i=it.subs.findIndex(x=>x.id===sid), j=i+dir;
  if(i<0||j<0||j>=it.subs.length) return;
  const tmp=it.subs[i]; it.subs[i]=it.subs[j]; it.subs[j]=tmp;
  openItem=itemId; subEdit=itemId; buzz(); save(); renderPlan();
}
function moveItem(id,dir){
  const arr=data.plans[viewShift];
  const list=plan(viewShift);
  const i=list.findIndex(x=>x.id===id), j=i+dir;
  if(i<0||j<0||j>=list.length) return;
  const a=arr.find(x=>x.id===list[i].id), b=arr.find(x=>x.id===list[j].id);
  const t=a.time; a.time=b.time; b.time=t;
  if(a.time===b.time){
    const ia=arr.indexOf(a), ib=arr.indexOf(b);
    arr[ia]=b; arr[ib]=a;
  }
  buzz(); save(); renderPlan();
}
function saveNote(itemId,val){
  const day=ensureDay(todayKey());
  if(val.trim()) day.notes[itemId]=val.trim(); else delete day.notes[itemId];
  snapshot(day); save();
}
function snapshot(day){
  day.snap=plan(day.shift||shiftOf(todayKey())).map(x=>({id:x.id,time:x.time,name:x.name,subs:(x.subs||[]).map(s=>({id:s.id,name:s.name}))}));
}

let editId=null;
function addItem(){ editId=null; openSheet("Neuer Punkt","",""); }
function editItem(id){ const it=data.plans[viewShift].find(x=>x.id===id); if(!it) return; editId=id; openSheet("Punkt bearbeiten",it.time||"",it.name); }
function openSheet(title,time,name){
  document.getElementById("sheet").innerHTML=`
    <h3>${title}</h3>
    <div class="sh-sub">${SHIFTS[viewShift]}</div>
    <div class="field"><label>Uhrzeit</label><input id="inp-time" type="time" value="${esc(time)}"></div>
    <div class="field"><label>Hauptpunkt</label><input id="inp" placeholder="z.B. Business Block" value="${esc(name)}"></div>
    <div class="actions">
      ${editId?'<button class="btn-del" onclick="removeItem(editId)">Löschen</button>':''}
      <button class="btn" onclick="saveItem()">${editId?"Speichern":"Hinzufügen"}</button>
    </div>`;
  document.getElementById("overlay").classList.add("open");
  setTimeout(()=>document.getElementById("inp").focus(),300);
}
function closeSheet(){ document.getElementById("overlay").classList.remove("open"); }
function saveItem(){
  const v=document.getElementById("inp").value.trim();
  const t=document.getElementById("inp-time").value;
  if(!v){ document.getElementById("inp").focus(); return; }
  if(editId){ const it=data.plans[viewShift].find(x=>x.id===editId); it.name=v; it.time=t; }
  else data.plans[viewShift].push({id:uid(),time:t,name:v,subs:[]});
  save(); closeSheet(); renderPlan();
}
function removeItem(id){
  data.plans[viewShift]=data.plans[viewShift].filter(x=>x.id!==id);
  save(); closeSheet(); renderPlan();
}
function toggleEdit(){ editMode=!editMode; openItem=null; addOpen=null; subEdit=null; renderPlan(); }

/* ---------- Woche ---------- */
function renderWeek(){
  const now=new Date();
  const mon=new Date(now); mon.setDate(now.getDate()-wdIdx(now));
  let rows="";
  DAYS.forEach((name,i)=>{
    const dt=new Date(mon); dt.setDate(mon.getDate()+i);
    const key=dateKey(dt), s=shiftOf(key), c=infoOf(key,"all");
    const isToday=key===todayKey();
    rows+=`<div class="wk ${isToday?'today':''}">
      <div class="wk-l">
        <div class="wk-n">${name}</div>
        <div class="wk-s">${dt.toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit"})}${c.total?" · "+c.done+"/"+c.total:""}${isToday?" · heute":""}</div>
      </div>
      <div class="pick">${Object.keys(SHIFTS).map(k=>`<button class="${s===k?'on':''}" onclick="setDayShift('${key}','${k}')">${SHORT[k]}</button>`).join("")}</div>
    </div>`;
  });
  document.getElementById("view").innerHTML=`
    <div class="wrap">
      <header>
        <div><div class="eyebrow">Schichten setzen</div><div class="title">Woche</div></div>
      </header>
      <div class="grid3">
        <button class="card" style="text-align:left" onclick="fillWeek('frueh')"><div class="card-lbl">Alles</div><div style="font-size:15px;font-weight:700;margin-top:5px">Früh</div></button>
        <button class="card" style="text-align:left" onclick="fillWeek('spaet')"><div class="card-lbl">Alles</div><div style="font-size:15px;font-weight:700;margin-top:5px">Spät</div></button>
        <button class="card" style="text-align:left" onclick="fillWeek('workweek')"><div class="card-lbl">Mo–Fr</div><div style="font-size:15px;font-weight:700;margin-top:5px">+ WE frei</div></button>
      </div>
      <div style="margin-top:16px">${rows}</div>
      <div class="hint">Gilt ab jetzt für diesen Wochentag – jeder Tag einzeln änderbar.</div>
    </div>`;
}
function setDayShift(key,s){
  data.week[wdIdx(keyToDate(key))]=s;
  const d=ensureDay(key); d.shift=s;
  if(key===todayKey()) viewShift=s;
  save(); buzz(); renderWeek();
}
function fillWeek(mode){
  for(let i=0;i<7;i++) data.week[i]= mode==="workweek" ? (i<5?"frueh":"frei") : mode;
  const d=ensureDay(todayKey()); d.shift=data.week[wdIdx(new Date())]; viewShift=d.shift;
  save(); buzz(); renderWeek(); toast("Woche gesetzt");
}

/* ---------- Kalender ---------- */
function renderCal(){
  const y=calMonth.getFullYear(), m=calMonth.getMonth();
  const dow=["Mo","Di","Mi","Do","Fr","Sa","So"];
  const lead=(new Date(y,m,1).getDay()+6)%7;
  const ndays=new Date(y,m+1,0).getDate();
  const tk=todayKey(), endToday=new Date(new Date().setHours(23,59,59));

  let cells="", full=0, sumP=0, cnt=0;
  for(let i=0;i<lead;i++) cells+=`<div class="cell blank"></div>`;
  for(let d=1;d<=ndays;d++){
    const dt=new Date(y,m,d), key=dateKey(dt);
    const c=infoOf(key,calScope);
    const p=c.total? c.done/c.total : 0;
    let cls="cell";
    if(c.total){ cls+=" has"; sumP+=p; cnt++; }
    if(c.total&&c.done===c.total){ cls+=" full"; full++; }
    if(key===tk) cls+=" today";
    const future=dt>endToday;
    cls += future? " future":" tap";
    const sh=shiftOf(key);
    cells+=`<div class="${cls}" ${future?'':`onclick="openDay('${key}')"`}>
      <div class="cd num">${d}</div>
      ${c.total?`<div class="cb"><i style="width:${Math.round(p*100)}%;background:${COLOR[sh]}"></i></div>`:''}
    </div>`;
  }
  const avg=cnt? Math.round(sumP/cnt*100):0;
  const scopes=[["all","Alle"],["frueh","Früh"],["spaet","Spät"],["frei","Frei"]];

  document.getElementById("view").innerHTML=`
    <div class="wrap">
      <header><div><div class="eyebrow">Verlauf</div><div class="title">Kalender</div></div></header>
      <div class="grid2">
        <div class="card"><div class="card-lbl">Volle Tage</div><div class="card-big num">${full}</div><div class="card-sub">im Monat</div></div>
        <div class="card"><div class="card-lbl">Ø Quote</div><div class="card-big num">${avg}%</div><div class="card-sub">${cnt} getrackte Tage</div></div>
      </div>
      <div class="switch">${scopes.map(s=>`<button class="${calScope===s[0]?'on':''}" onclick="setScope('${s[0]}')">${s[1]}</button>`).join("")}</div>
      <div class="cal-head">
        <button class="cal-arrow" onclick="changeMonth(-1)">&lsaquo;</button>
        <div class="cal-month">${calMonth.toLocaleDateString("de-DE",{month:"long",year:"numeric"})}</div>
        <button class="cal-arrow" onclick="changeMonth(1)">&rsaquo;</button>
      </div>
      <div class="cal-grid">${dow.map(d=>`<div class="dow">${d}</div>`).join("")}</div>
      <div class="cal-grid">${cells}</div>
      <div class="legend">
        ${Object.keys(SHIFTS).map(s=>`<span class="chip" style="color:var(--dim)"><span class="dot" style="background:${COLOR[s]}"></span>${SHORT[s]}</span>`).join("")}
      </div>
      <div class="hint">Balken = Anteil erledigt. Tag antippen für Details.</div>
    </div>`;
}
function setScope(s){ calScope=s; renderCal(); }
function changeMonth(d){ calMonth.setMonth(calMonth.getMonth()+d); renderCal(); }

function openDay(key){
  const d=data.days[key], items=itemsOf(key);
  const label=keyToDate(key).toLocaleDateString("de-DE",{weekday:"long",day:"numeric",month:"long"});
  let body="", done=0;
  if(!items.length) body=`<div class="empty">An diesem Tag wurde nichts getrackt.</div>`;
  else body=items.map(it=>{
    const ok=d? !!d.done[it.id] : false; if(ok) done++;
    const note=d&&d.notes? d.notes[it.id] : "";
    const subs=(it.subs||[]).map(s=>{
      const sd=d&&d.subDone? !!d.subDone[s.id] : false;
      return `<div style="font-size:12px;color:${sd?'var(--dim)':'var(--faint)'};padding:1px 0 1px 47px">${sd?'✓':'·'} ${esc(s.name)}</div>`;
    }).join("");
    return `<div class="drow ${ok?'done':'miss'}">
        <span class="dt">${esc(it.time||"—")}</span>
        <span class="dn">${esc(it.name)}</span>
        <span class="ds"></span>
      </div>
      ${subs}
      ${note?`<div class="dnote">${esc(note)}</div>`:''}`;
  }).join("");
  document.getElementById("sheet").innerHTML=`
    <h3>${label}</h3>
    <div class="sh-sub">${SHIFTS[shiftOf(key)]}${items.length?` · ${done} von ${items.length} erledigt`:''}</div>
    <div class="scroll">${body}</div>
    <div class="actions"><button class="btn" onclick="closeSheet()">Schließen</button></div>`;
  document.getElementById("overlay").classList.add("open");
}

/* ---------- Statistik ---------- */
function lastKeys(n){
  const out=[];
  for(let i=n-1;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-i); out.push(dateKey(d)); }
  return out;
}
function renderStats(){
  const keys=lastKeys(statRange);
  const tracked=keys.filter(k=>infoOf(k,"all").total>0);
  const avg=tracked.length? Math.round(tracked.reduce((a,k)=>a+pctOf(k),0)/tracked.length*100):0;
  const fullDays=tracked.filter(dayComplete).length;

  const bars=keys.slice(-7).map(k=>{
    const p=Math.round(pctOf(k)*100);
    const dt=keyToDate(k);
    return `<div class="bar ${p===100?'hi':''}"><i style="height:${Math.max(p,3)}%"></i><span>${["Mo","Di","Mi","Do","Fr","Sa","So"][wdIdx(dt)]}</span></div>`;
  }).join("");

  let cmp="";
  Object.keys(SHIFTS).forEach(s=>{
    const ks=keys.filter(k=>infoOf(k,"all").total>0 && shiftOf(k)===s);
    const v=ks.length? Math.round(ks.reduce((a,k)=>a+pctOf(k),0)/ks.length*100):0;
    cmp+=`<div class="hbar">
      <div class="hl">${SHORT[s]}</div>
      <div class="ht"><i style="width:${v}%;background:${COLOR[s]}"></i></div>
      <div class="hv num">${v}%${ks.length?"":" –"}</div>
    </div>`;
  });

  const tally={};
  keys.forEach(k=>{
    const d=data.days[k]; const items=itemsOf(k);
    if(!items.length||!d) return;
    items.forEach(it=>{
      if(!tally[it.name]) tally[it.name]={t:0,d:0};
      tally[it.name].t++; if(d.done[it.id]) tally[it.name].d++;
    });
  });
  const ranked=Object.entries(tally).filter(([,v])=>v.t>=2).map(([n,v])=>({n,p:v.d/v.t,t:v.t}))
    .sort((a,b)=>a.p-b.p).slice(0,5);
  const rankRows = ranked.length
    ? ranked.map(r=>`<div class="rank"><div class="ri">${esc(r.n)}</div><div class="rv num">${Math.round(r.p*100)}%</div></div>`).join("")
    : `<div class="empty" style="padding:20px 0">Noch zu wenig Daten.</div>`;

  document.getElementById("view").innerHTML=`
    <div class="wrap">
      <header><div><div class="eyebrow">Letzte ${statRange} Tage</div><div class="title">Statistik</div></div></header>
      <div class="grid3">
        <div class="card"><div class="card-lbl">Ø Quote</div><div class="card-big num">${avg}%</div></div>
        <div class="card"><div class="card-lbl">Volle Tage</div><div class="card-big num">${fullDays}</div></div>
        <div class="card"><div class="card-lbl">Beste Serie</div><div class="card-big num">${bestStreak()}</div></div>
      </div>
      <div class="switch">
        ${[7,30,90].map(n=>`<button class="${statRange===n?'on':''}" onclick="setRange(${n})">${n} Tage</button>`).join("")}
      </div>

      <div class="sec-title">Letzte 7 Tage</div>
      <div class="card"><div class="bars">${bars}</div></div>

      <div class="sec-title">Früh vs. Spät</div>
      <div class="card">${cmp}</div>

      <div class="sec-title">Am häufigsten verpasst</div>
      <div class="card">${rankRows}</div>

      <div class="hint" style="margin-top:16px">Aktueller Streak: ${streak()} Tage · ${tracked.length} getrackte Tage im Zeitraum</div>
    </div>`;
}
function setRange(n){ statRange=n; renderStats(); }

/* ---------- Einstellungen ---------- */
function renderSettings(){
  const ic=p=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
  let alert="";
  if(backupDue()){
    const d=daysSinceBackup();
    alert=`<div class="alert"><span class="ad"></span><span class="at">Backup fällig
      <div class="as">${d===null?"Noch kein Backup gespeichert.":"Letztes Backup vor "+d+" Tagen."} Unten „Backup speichern“ tippen.</div></span></div>`;
  }
  document.getElementById("view").innerHTML=`
    <div class="wrap">
      <header><div><div class="eyebrow">Verwalten</div><div class="title">Mehr</div></div></header>
      ${alert}
      <div class="sec-title">Pläne</div>
      <button class="srow" onclick="copyPlan('frueh','spaet')"><span class="sico">${ic('<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>')}</span>
        <span class="stxt"><div class="st">Früh &rarr; Spät kopieren</div><div class="ss">Überschreibt den Spät-Plan</div></span></button>
      <button class="srow" onclick="copyPlan('spaet','frueh')"><span class="sico">${ic('<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>')}</span>
        <span class="stxt"><div class="st">Spät &rarr; Früh kopieren</div><div class="ss">Überschreibt den Früh-Plan</div></span></button>

      <button class="srow" onclick="loadTemplate()"><span class="sico">${ic('<path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6"/>')}</span>
        <span class="stxt"><div class="st">Vorlage laden</div><div class="ss">Setzt Früh, Spät und Frei auf den Standardplan zurück</div></span></button>

      <div class="sec-title">Backup</div>
      <button class="srow" onclick="exportData()"><span class="sico">${ic('<path d="M12 3v12M7 10l5 5 5-5M5 21h14"/>')}</span>
        <span class="stxt"><div class="st">Backup speichern</div><div class="ss">.json in Dateien / iCloud sichern</div></span></button>
      <button class="srow" onclick="document.getElementById('import-file').click()"><span class="sico">${ic('<path d="M12 21V9M7 14l5-5 5 5M5 3h14"/>')}</span>
        <span class="stxt"><div class="st">Backup laden</div><div class="ss">Aus .json wiederherstellen</div></span></button>

      <div class="sec-title">Gefahrenzone</div>
      <button class="srow danger" onclick="resetAll()"><span class="sico">${ic('<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/>')}</span>
        <span class="stxt"><div class="st">Alle Daten löschen</div><div class="ss">Pläne und Historie auf diesem Gerät</div></span></button>

      <div class="snote">Alles liegt lokal in diesem Browser. Alle 30 Tage erscheint hier eine Backup-Erinnerung. iPhone: Backup speichern &rsaquo; In Dateien sichern &rsaquo; iCloud-Ordner. Zum Home-Bildschirm hinzufügen für App-Feeling.</div>
    </div>`;
}
function copyPlan(from,to){
  if(!confirm(SHIFTS[to]+"-Plan mit dem "+SHIFTS[from]+"-Plan überschreiben?")) return;
  data.plans[to]=data.plans[from].map(x=>({id:uid(),time:x.time,name:x.name,subs:(x.subs||[]).map(s=>({id:uid(),name:s.name}))}));
  save(); toast("Plan kopiert");
}

/* ---------- Backup ---------- */
function backupAnchor(){ return (data.meta&&data.meta.lastBackup)||(data.meta&&data.meta.created)||Date.now(); }
function backupDue(){ return (Date.now()-backupAnchor())>=30*86400000; }
function daysSinceBackup(){ const l=data.meta&&data.meta.lastBackup; return l? Math.floor((Date.now()-l)/86400000):null; }
function updateBadge(){ const b=document.getElementById("nav-badge"); if(b) b.classList.toggle("on", backupDue()); }
function exportData(){
  const blob=new Blob([JSON.stringify(data)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="routine-backup-"+todayKey()+".json";
  document.body.appendChild(a); a.click(); a.remove();
  data.meta.lastBackup=Date.now(); save(); updateBadge();
  if(tab==="settings") renderSettings();
  toast("Backup gespeichert");
}
document.getElementById("import-file").addEventListener("change",e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ applyBackup(r.result); e.target.value=""; };
  r.readAsText(f);
});
function applyBackup(raw){
  try{
    const d=JSON.parse((raw||"").trim());
    if(!d||!d.plans) throw 0;
    data=migrate(d);
    if(!data.meta.created) data.meta.created=Date.now();
    viewShift=null; save(); closeSheet(); render(); updateBadge(); toast("Daten wiederhergestellt");
  }catch(e){ toast("Backup konnte nicht gelesen werden"); }
}
function resetAll(){
  if(!confirm("Alle Pläne und die komplette Historie auf diesem Gerät löschen?")) return;
  data={ plans:{frueh:[],spaet:[],frei:[]}, week:{}, days:{}, meta:{created:Date.now()}, ui:{} };
  localStorage.removeItem(STORE+"_seed");
  viewShift=null; save(); render(); updateBadge(); toast("Alles gelöscht");
}

/* ---------- Helfer ---------- */
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function esc(s){ return (s||"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function buzz(){ if(navigator.vibrate) navigator.vibrate(8); }
let toastT;
function toast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg; t.classList.add("show");
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),1900);
}
function switchTab(t){
  tab=t; editMode=false; openItem=null; addOpen=null; subEdit=null;
  if(t==="cal") calMonth=new Date();
  if(t==="plan") viewShift=shiftOf(todayKey());
  document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x.dataset.tab===t));
  render(); window.scrollTo(0,0);
}

/* ---------- Vorlage ---------- */
const MIND=["Beten","Journal","Buch lesen","In Stille sitzen"];
const SPORT=["10–20 Klimmzüge","20–30 Liegestütze","20 Crunch Sit-ups","15 Beine heben","20 Crunch liegend, Arm zum Fuß (je Seite)"];
const CARE=["Eiswürfel","Skincare","Zähne","Haar-Serum","Tabletten","Minoxidil","Bartöl (Bart + Augenbrauen)"];
const FOOD=["Joghurt mit Honig","Müsli","Obst"];
const BIZ=["bulltape / Tools","Kunden / Discord","X Post"];
const BIZ2=["Deep Work Block","Charts / Journal"];
const NIGHT=["Thank God","Journal: Tag + Emotionen","Morgen planen","Buch lesen + Gedanken notieren","10–15 Min still sitzen"];

const TEMPLATE={
  spaet:[
    ["08:00","Aufstehen + Mind Time",MIND],
    ["09:30","Sport",SPORT],
    ["10:15","Wasser + Duschen",CARE],
    ["10:45","Frühstück",FOOD],
    ["11:00","Business",BIZ],
    ["13:45","Arbeit Spätschicht"],
    ["20:30","Abendessen"],
    ["21:00","Business",BIZ2],
    ["23:00","Night Routine",NIGHT],
    ["23:30","Schlafen"]
  ],
  frueh:[
    ["04:45","Aufstehen + Mind Time",["Beten","Journal","In Stille sitzen"]],
    ["05:15","Frühstück",FOOD],
    ["05:45","Los zur Arbeit"],
    ["06:00","Arbeit Frühschicht"],
    ["14:45","Sport",SPORT],
    ["15:45","Wasser + Duschen",CARE],
    ["16:30","Essen"],
    ["17:00","Business",BIZ],
    ["20:00","Abendessen"],
    ["20:30","Business",BIZ2],
    ["22:00","Night Routine",NIGHT],
    ["22:30","Schlafen"]
  ],
  frei:[
    ["08:00","Aufstehen + Mind Time",MIND],
    ["09:30","Sport",SPORT],
    ["10:15","Wasser + Duschen",CARE],
    ["10:45","Frühstück",FOOD],
    ["11:15","Business Deep Work",["bulltape / Tools","Feature bauen","Bugs fixen"]],
    ["14:00","Mittagessen"],
    ["15:00","Business",["Content / X","Kunden / Discord"]],
    ["18:00","Freizeit"],
    ["20:30","Abendessen"],
    ["21:00","Business",BIZ2],
    ["23:00","Night Routine",NIGHT],
    ["23:30","Schlafen"]
  ]
};
function buildTemplate(){
  const mk=a=>a.map(x=>({id:uid(),time:x[0],name:x[1],subs:(x[2]||[]).map(n=>({id:uid(),name:n}))}));
  return { frueh:mk(TEMPLATE.frueh), spaet:mk(TEMPLATE.spaet), frei:mk(TEMPLATE.frei) };
}
function loadTemplate(){
  if(!confirm("Alle drei Pläne mit der Vorlage überschreiben? Erledigte Tage bleiben erhalten.")) return;
  data.plans=buildTemplate(); save(); toast("Vorlage geladen");
  if(tab==="settings") renderSettings();
}
/* einmalig ausrollen */
if(!localStorage.getItem(STORE+"_tpl1")){
  data.plans=buildTemplate();
  for(let i=0;i<7;i++) if(data.week[i]===undefined) data.week[i]= i<5? "frueh":"frei";
  localStorage.setItem(STORE+"_tpl1","1"); save();
}

if(!data.meta) data.meta={};
if(!data.ui) data.ui={};
if(!data.meta.created){ data.meta.created=Date.now(); save(); }

let lastDay=todayKey();
function refreshOnReturn(){
  if(todayKey()!==lastDay){ viewShift=null; openItem=null; addOpen=null; subEdit=null; }
  render(); updateBadge(); lastDay=todayKey();
}
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) refreshOnReturn(); });
window.addEventListener("focus",refreshOnReturn);
window.addEventListener("pageshow",refreshOnReturn);
setInterval(()=>{ if(todayKey()!==lastDay) refreshOnReturn(); },60000);

render();
updateBadge();

if("serviceWorker" in navigator){ window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{})); }
</script>
