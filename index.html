<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Routine">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<title>Routine</title>
<style>
  :root{
    --bg:#000000;
    --surface:#141416;
    --surface-2:#1d1d20;
    --border:#2a2a2e;
    --text:#f5f5f5;
    --dim:#8a8a8f;
    --faint:#54545a;
    --done:#f5f5f5;
    --danger:#d6685f;
    --safe-top:env(safe-area-inset-top,0px);
    --safe-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;overscroll-behavior-y:none;}
  body{padding-bottom:calc(82px + var(--safe-bottom));}
  button{font-family:inherit;color:inherit;border:none;background:none;cursor:pointer;}
  input{font-family:inherit;}
  .wrap{max-width:480px;margin:0 auto;padding:0 20px;}

  header{padding-top:calc(var(--safe-top) + 26px);display:flex;align-items:flex-start;justify-content:space-between;}
  .h-left{min-width:0;}
  .h-date{font-size:13px;color:var(--faint);font-weight:600;letter-spacing:.02em;}
  .h-title{font-size:30px;font-weight:700;letter-spacing:-.025em;margin-top:3px;}
  .h-edit{font-size:15px;font-weight:600;color:var(--dim);padding:6px 4px;margin-top:24px;}
  .h-edit.on{color:var(--text);}
  .h-refresh{color:var(--faint);padding:6px;margin-top:24px;display:flex;}
  .h-refresh:active{color:var(--text);}
  .h-refresh:active svg{transform:rotate(-180deg);}
  .h-refresh svg{transition:transform .4s;}
  .streak{font-size:12px;color:var(--faint);font-weight:600;margin-top:4px;}
  .streak b{color:var(--text);font-weight:700;}

  .prog{margin:22px 0 6px;}
  .prog-meta{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--dim);font-weight:600;margin-bottom:9px;}
  .prog-pct{color:var(--text);}
  .prog-bar{height:5px;border-radius:3px;background:var(--surface-2);overflow:hidden;}
  .prog-fill{height:100%;background:var(--done);border-radius:3px;width:0;transition:width .6s cubic-bezier(.22,1,.36,1);}

  .list{margin-top:18px;}
  .item{display:flex;align-items:center;gap:15px;background:var(--surface);border:1px solid var(--border);
    border-radius:15px;padding:16px 17px;margin-bottom:10px;transition:background .15s;}
  .item:active{background:var(--surface-2);}
  .check{flex:0 0 25px;height:25px;border-radius:8px;border:2px solid var(--faint);
    display:flex;align-items:center;justify-content:center;transition:all .18s;}
  .check svg{width:14px;height:14px;opacity:0;transform:scale(.4);transition:all .2s cubic-bezier(.34,1.56,.64,1);}
  .item.done .check{background:var(--done);border-color:var(--done);}
  .item.done .check svg{opacity:1;transform:scale(1);}
  .item-name{flex:1;font-size:16.5px;font-weight:500;letter-spacing:-.01em;min-width:0;}
  .item.done .item-name{color:var(--dim);text-decoration:line-through;text-decoration-color:var(--faint);}
  .item-remove{flex:0 0 auto;width:25px;height:25px;border-radius:50%;background:var(--danger);
    display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;line-height:1;font-weight:600;}
  .chev{flex:0 0 auto;color:var(--faint);font-size:18px;}

  .add-row{display:flex;align-items:center;gap:12px;padding:15px 17px;border:1px dashed var(--border);
    border-radius:15px;color:var(--dim);font-size:15px;font-weight:600;margin-top:2px;}
  .add-row:active{background:var(--surface);}
  .add-row .plus{font-size:20px;line-height:1;}
  .empty{text-align:center;padding:36px 20px 24px;color:var(--faint);font-size:14px;line-height:1.5;}

  /* Calendar */
  .seg{display:flex;gap:4px;background:var(--surface-2);border-radius:13px;padding:4px;margin:20px 0 4px;}
  .seg button{flex:1;padding:9px 4px;border-radius:9px;font-size:13px;font-weight:600;color:var(--dim);transition:all .15s;}
  .seg button.on{background:#34343a;color:var(--text);}
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin:18px 0 6px;}
  .cal-month{font-size:17px;font-weight:700;}
  .cal-arrow{font-size:22px;color:var(--dim);padding:6px 16px;border-radius:10px;}
  .cal-arrow:active{background:var(--surface-2);}
  .cal-sub{font-size:12px;color:var(--faint);font-weight:600;margin-bottom:16px;}
  .cal-sub b{color:var(--text);}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
  .cal-dow{text-align:center;font-size:11px;color:var(--faint);font-weight:600;}
  .cal-cell{aspect-ratio:1;border-radius:11px;display:flex;align-items:center;justify-content:center;
    font-size:13.5px;font-weight:600;background:var(--surface);border:1px solid var(--border);color:var(--dim);}
  .cal-cell.blank{background:transparent;border:none;}
  .cal-cell.full{background:var(--text);color:#000;border-color:var(--text);}
  .cal-cell.partial{background:#46464c;color:var(--text);border-color:#46464c;}
  .cal-cell.today{box-shadow:0 0 0 2px var(--dim);}
  .cal-cell.future{opacity:.3;}
  .cal-cell.tap{cursor:pointer;}
  .cal-cell.tap:active{filter:brightness(1.25);}
  .cal-legend{display:flex;gap:18px;justify-content:center;margin-top:20px;font-size:12px;color:var(--dim);font-weight:500;}
  .lg{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-1px;}
  .cal-hint{text-align:center;font-size:11.5px;color:var(--faint);margin-top:14px;}

  /* Day detail */
  .d-scroll{max-height:62vh;overflow-y:auto;margin:0 -2px;padding:2px;}
  .d-sec{font-size:11px;color:var(--faint);font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin:18px 0 8px;}
  .d-sec.first{margin-top:0;}
  .d-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 15px;
    background:var(--surface);border:1px solid var(--border);border-radius:13px;margin-bottom:8px;}
  .d-name{font-size:15.5px;font-weight:500;min-width:0;}
  .d-stat{font-size:12px;font-weight:700;flex:0 0 auto;display:flex;align-items:center;gap:6px;}
  .d-dot{width:8px;height:8px;border-radius:50%;}
  .d-row.done .d-stat{color:var(--text);}
  .d-row.done .d-dot{background:var(--text);}
  .d-row.miss .d-name{color:var(--dim);}
  .d-row.miss .d-stat{color:var(--faint);}
  .d-row.miss .d-dot{background:var(--faint);}

  nav{position:fixed;bottom:0;left:0;right:0;background:rgba(0,0,0,.82);
    backdrop-filter:saturate(180%) blur(22px);-webkit-backdrop-filter:saturate(180%) blur(22px);
    border-top:1px solid var(--border);padding-bottom:var(--safe-bottom);z-index:50;}
  .nav-inner{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);}
  .tab{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:11px 0 9px;color:var(--faint);font-size:10.5px;font-weight:600;}
  .tab svg{width:21px;height:21px;}
  .tab.active{color:var(--text);}
  .nav-badge{position:absolute;top:8px;left:calc(50% + 8px);width:9px;height:9px;border-radius:50%;
    background:var(--danger);border:2px solid #000;display:none;}
  .nav-badge.on{display:block;}

  .s-alert{display:flex;gap:13px;align-items:flex-start;background:rgba(214,104,95,.1);
    border:1px solid rgba(214,104,95,.35);border-radius:15px;padding:15px 16px;margin-top:4px;}
  .s-alert .a-dot{flex:0 0 auto;width:9px;height:9px;border-radius:50%;background:var(--danger);margin-top:5px;}
  .s-alert .a-txt{font-size:13.5px;line-height:1.45;color:var(--text);font-weight:600;}
  .s-alert .a-sub{color:var(--dim);font-size:12.5px;font-weight:500;margin-top:3px;}

  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(4px);z-index:100;
    display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s;}
  .overlay.open{opacity:1;pointer-events:auto;}
  .sheet{background:var(--surface);width:100%;max-width:480px;border-radius:24px 24px 0 0;
    padding:24px 20px calc(24px + var(--safe-bottom));transform:translateY(100%);
    transition:transform .28s cubic-bezier(.22,1,.36,1);border-top:1px solid var(--border);}
  .overlay.open .sheet{transform:translateY(0);}
  .sheet h3{margin:0 0 18px;font-size:19px;font-weight:700;}
  .field label{display:block;font-size:12px;color:var(--dim);font-weight:600;margin-bottom:8px;letter-spacing:.02em;}
  .field input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:13px;
    padding:15px;font-size:16px;color:var(--text);outline:none;transition:border-color .15s;}
  .field input:focus{border-color:var(--dim);}
  .sheet-actions{display:flex;gap:10px;margin-top:18px;}
  .btn-primary{flex:1;background:var(--text);color:#000;border-radius:14px;padding:15px;font-size:16px;font-weight:700;}
  .btn-primary:active{filter:brightness(.88);}
  .btn-del{padding:15px 18px;font-size:16px;font-weight:600;color:var(--danger);}

  /* Settings */
  .s-sec{font-size:11px;color:var(--faint);font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin:28px 0 10px;}
  .s-row{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--border);
    border-radius:15px;padding:16px 17px;margin-bottom:10px;width:100%;text-align:left;}
  .s-row:active{background:var(--surface-2);}
  .s-ico{flex:0 0 auto;color:var(--dim);display:flex;}
  .s-ico svg{width:21px;height:21px;}
  .s-txt{flex:1;min-width:0;}
  .s-title{font-size:16px;font-weight:600;letter-spacing:-.01em;}
  .s-sub{font-size:12.5px;color:var(--faint);margin-top:2px;}
  .s-row.danger .s-title{color:var(--danger);}
  .s-row.danger .s-ico{color:var(--danger);}
  .s-note{font-size:12.5px;color:var(--faint);line-height:1.6;margin-top:16px;padding:0 2px;}
  .field textarea{width:100%;min-height:130px;background:var(--bg);border:1px solid var(--border);border-radius:13px;
    padding:14px;font-size:13px;color:var(--text);outline:none;resize:vertical;font-family:ui-monospace,Menlo,monospace;}
  .field textarea:focus{border-color:var(--dim);}

  #toast{position:fixed;left:50%;bottom:calc(100px + var(--safe-bottom));
    transform:translateX(-50%) translateY(20px);background:var(--text);color:#000;font-size:14px;font-weight:600;
    padding:12px 20px;border-radius:30px;opacity:0;pointer-events:none;transition:all .25s;z-index:200;white-space:nowrap;}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  @media (prefers-reduced-motion:reduce){*{transition:none!important;}}
  .view{animation:fade .25s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
</style>
</head>
<body>

<div class="view" id="view"></div>

<nav>
  <div class="nav-inner">
    <button class="tab active" data-tab="morning" onclick="switchTab('morning')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v2M5.6 5.6l1.4 1.4M3 12h2M19 12h2M17 7l1.4-1.4M22 19H2M18 19a6 6 0 0 0-12 0"/></svg>
      Morning
    </button>
    <button class="tab" data-tab="day" onclick="switchTab('day')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>
      Day
    </button>
    <button class="tab" data-tab="night" onclick="switchTab('night')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4 7 7 0 1 0 20 14.5z"/></svg>
      Night
    </button>
    <button class="tab" data-tab="cal" onclick="switchTab('cal')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>
      Calendar
    </button>
    <button class="tab" data-tab="settings" onclick="switchTab('settings')">
      <span class="nav-badge" id="nav-badge"></span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      Settings
    </button>
  </div>
</nav>

<div class="overlay" id="overlay" onclick="if(event.target===this)closeSheet()">
  <div class="sheet" id="sheet"></div>
</div>

<input type="file" id="import-file" accept="application/json,.json" style="display:none">
<div id="toast"></div>

<script>
const STORE="routineTracker_v2";
const BUCKETS={morning:"Morning Routine", day:"Through the Day", night:"Night Routine"};
const REFRESH='<button class="h-refresh" aria-label="Refresh" onclick="location.reload()"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6"/></svg></button>';
let data=load();
let tab="morning";
let editMode=false;
let calMonth=new Date();
let calScope="all";

function load(){
  try{ const d=JSON.parse(localStorage.getItem(STORE)); if(d&&d.morning) return d; }catch(e){}
  return { morning:[], day:[], night:[], days:{}, meta:{} };
}
function save(){ localStorage.setItem(STORE, JSON.stringify(data)); }
function dateKey(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function todayKey(){ return dateKey(new Date()); }

function ensureDay(key){
  if(!data.days[key]) data.days[key]={ done:{morning:{},day:{},night:{}}, ids:{} };
  const d=data.days[key];
  if(!d.done) d.done={morning:{},day:{},night:{}};
  if(!d.ids) d.ids={};
  return d;
}
function bucketInfo(key,b){
  const d=data.days[key];
  let ids;
  if(key===todayKey()) ids=data[b].map(x=>x.id);
  else ids=(d&&d.ids&&d.ids[b])? d.ids[b] : (d&&d.done&&d.done[b]? Object.keys(d.done[b]) : []);
  const done=d&&d.done&&d.done[b] ? ids.filter(id=>d.done[b][id]).length : 0;
  return {done,total:ids.length};
}
function scopeInfo(key,scope){
  if(scope!=="all") return bucketInfo(key,scope);
  let t=0,dn=0;
  for(const b in BUCKETS){ const c=bucketInfo(key,b); t+=c.total; dn+=c.done; }
  return {done:dn,total:t};
}
function dayComplete(key){ const c=scopeInfo(key,"all"); return c.total>0 && c.done===c.total; }
function streak(){
  let s=0, cur=new Date();
  if(!dayComplete(todayKey())) cur.setDate(cur.getDate()-1);
  while(dayComplete(dateKey(cur))){ s++; cur.setDate(cur.getDate()-1); }
  return s;
}

/* ---- dispatcher ---- */
function render(){ if(tab==="cal") renderCal(); else if(tab==="settings") renderSettings(); else renderList(); }

/* ---- list view ---- */
function renderList(){
  const key=todayKey();
  const day=ensureDay(key);
  const items=data[tab];
  const info=bucketInfo(key,tab);
  const pct=info.total? Math.round(info.done/info.total*100):0;

  let rows="";
  if(!items.length){
    rows=`<div class="empty">Nothing here yet.<br>Add your first ${tab==="day"?"goal":"task"} below.</div>`;
  } else {
    rows=items.map(it=>{
      const done=!!day.done[tab][it.id];
      if(editMode){
        return `<div class="item" onclick='editItem("${it.id}")'>
          <button class="item-remove" onclick='event.stopPropagation();removeItem("${it.id}")'>&minus;</button>
          <div class="item-name">${esc(it.name)}</div>
          <span class="chev">&rsaquo;</span>
        </div>`;
      }
      return `<div class="item ${done?'done':''}" onclick='toggle("${it.id}")'>
        <div class="check"><svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg></div>
        <div class="item-name">${esc(it.name)}</div>
      </div>`;
    }).join("");
  }

  document.getElementById("view").innerHTML=`
    <div class="wrap">
      <header>
        <div class="h-left">
          <div class="h-date">${new Date().toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"})}</div>
          <div class="h-title">${BUCKETS[tab]}</div>
          <div class="streak"><b>${streak()}</b> day streak</div>
        </div>
        <div style="display:flex;align-items:center;gap:2px;">
          ${REFRESH}
          <button class="h-edit ${editMode?'on':''}" onclick="toggleEdit()">${editMode?"Done":"Edit"}</button>
        </div>
      </header>
      <div class="prog">
        <div class="prog-meta"><span>${info.done} of ${info.total} done</span><span class="prog-pct">${pct}%</span></div>
        <div class="prog-bar"><div class="prog-fill" style="width:${pct}%"></div></div>
      </div>
      <div class="list">
        ${rows}
        <div class="add-row" onclick="addItem()"><span class="plus">+</span> Add ${tab==="day"?"goal":"task"}</div>
      </div>
    </div>`;
}

/* ---- calendar view ---- */
function renderCal(){
  const y=calMonth.getFullYear(), m=calMonth.getMonth();
  const dow=["Mo","Tu","We","Th","Fr","Sa","Su"];
  const lead=(new Date(y,m,1).getDay()+6)%7;
  const ndays=new Date(y,m+1,0).getDate();
  const tk=todayKey();
  const endToday=new Date(new Date().setHours(23,59,59));

  let cells="", fullCount=0;
  for(let i=0;i<lead;i++) cells+=`<div class="cal-cell blank"></div>`;
  for(let d=1;d<=ndays;d++){
    const dt=new Date(y,m,d), key=dateKey(dt);
    const c=scopeInfo(key,calScope);
    let cls="cal-cell";
    if(c.total>0 && c.done===c.total){ cls+=" full"; fullCount++; }
    else if(c.done>0) cls+=" partial";
    if(key===tk) cls+=" today";
    const future = dt>endToday;
    if(future) cls+=" future"; else cls+=" tap";
    cells+=`<div class="${cls}" ${future?'':`onclick="openDay('${key}')"`}>${d}</div>`;
  }

  const scopes=[["all","All"],["morning","Morning"],["day","Day"],["night","Night"]];
  document.getElementById("view").innerHTML=`
    <div class="wrap">
      <header>
        <div class="h-left">
          <div class="h-date">Overview</div>
          <div class="h-title">Calendar</div>
          <div class="streak"><b>${streak()}</b> day streak</div>
        </div>
        ${REFRESH}
      </header>
      <div class="seg">
        ${scopes.map(s=>`<button class="${calScope===s[0]?'on':''}" onclick="setScope('${s[0]}')">${s[1]}</button>`).join("")}
      </div>
      <div class="cal-head">
        <button class="cal-arrow" onclick="changeMonth(-1)">&lsaquo;</button>
        <div class="cal-month">${calMonth.toLocaleDateString("en-US",{month:"long",year:"numeric"})}</div>
        <button class="cal-arrow" onclick="changeMonth(1)">&rsaquo;</button>
      </div>
      <div class="cal-sub"><b>${fullCount}</b> full ${fullCount===1?"day":"days"} this month${calScope==="all"?" (everything done)":""}</div>
      <div class="cal-grid">${dow.map(d=>`<div class="cal-dow">${d}</div>`).join("")}</div>
      <div class="cal-grid" style="margin-top:6px;">${cells}</div>
      <div class="cal-legend">
        <span><span class="lg" style="background:var(--text)"></span>Complete</span>
        <span><span class="lg" style="background:#46464c"></span>Partial</span>
        <span><span class="lg" style="background:var(--surface)"></span>None</span>
      </div>
      <div class="cal-hint">Tap a day to see what you did and missed</div>
    </div>`;
}
function setScope(s){ calScope=s; renderCal(); }
function changeMonth(d){ calMonth.setMonth(calMonth.getMonth()+d); renderCal(); }

function openDay(key){
  const d=data.days[key];
  const label=new Date(key+"T00:00:00").toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"});
  const buckets = calScope==="all" ? Object.keys(BUCKETS) : [calScope];
  let body="", totalDone=0, totalAll=0, first=true;
  buckets.forEach(b=>{
    let ids;
    if(key===todayKey()) ids=data[b].map(x=>x.id);
    else ids=(d&&d.ids&&d.ids[b])? d.ids[b] : (d&&d.done&&d.done[b]? Object.keys(d.done[b]):[]);
    if(!ids.length) return;
    body+=`<div class="d-sec ${first?'first':''}">${BUCKETS[b]}</div>`; first=false;
    ids.forEach(id=>{
      const done=d&&d.done&&d.done[b] ? !!d.done[b][id] : false;
      const it=data[b].find(x=>x.id===id);
      const name=it? it.name : "(removed)";
      totalAll++; if(done) totalDone++;
      body+=`<div class="d-row ${done?'done':'miss'}">
        <span class="d-name">${esc(name)}</span>
        <span class="d-stat"><span class="d-dot"></span>${done?'Done':'Missed'}</span>
      </div>`;
    });
  });
  if(!totalAll) body=`<div class="empty" style="padding:30px 0">Nothing was tracked on this day.</div>`;
  document.getElementById("sheet").innerHTML=`
    <h3>${label}</h3>
    ${totalAll?`<div class="cal-sub" style="margin:-8px 0 14px"><b>${totalDone}</b> of ${totalAll} done</div>`:''}
    <div class="d-scroll">${body}</div>
    <div class="sheet-actions"><button class="btn-primary" onclick="closeSheet()">Close</button></div>`;
  document.getElementById("overlay").classList.add("open");
}

/* ---- settings view ---- */
function renderSettings(){
  const sIco='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>';
  const lIco='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21V9M7 14l5-5 5 5M5 3h14"/></svg>';
  const rIco='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>';

  let alert="";
  if(backupDue()){
    const d=daysSinceBackup();
    alert=`<div class="s-alert">
      <span class="a-dot"></span>
      <span class="a-txt">Backup due
        <div class="a-sub">${d===null?"You haven't saved a backup yet.":"Your last backup was "+d+" days ago."} Tap “Save backup file” below.</div>
      </span>
    </div>`;
  }

  document.getElementById("view").innerHTML=`
    <div class="wrap">
      <header><div class="h-left"><div class="h-date">Manage</div><div class="h-title">Settings</div></div>${REFRESH}</header>

      ${alert}

      <div class="s-sec">Backup</div>
      <button class="s-row" onclick="exportData()">
        <span class="s-ico">${sIco}</span>
        <span class="s-txt"><div class="s-title">Save backup file</div><div class="s-sub">Download a .json to Files / iCloud</div></span>
      </button>
      <button class="s-row" onclick="document.getElementById('import-file').click()">
        <span class="s-ico">${lIco}</span>
        <span class="s-txt"><div class="s-title">Load backup file</div><div class="s-sub">Restore from a .json file</div></span>
      </button>

      <div class="s-sec">Danger zone</div>
      <button class="s-row danger" onclick="resetAll()">
        <span class="s-ico">${rIco}</span>
        <span class="s-txt"><div class="s-title">Reset all data</div><div class="s-sub">Delete everything on this device</div></span>
      </button>

      <div class="s-note">Your data lives only in this browser on this device. A reminder appears here every 30 days so your backup stays current. On iPhone: tap Save backup file &rsaquo; Save to Files &rsaquo; pick an iCloud folder. Add to Home Screen to keep it as an app.</div>
    </div>`;
}

/* ---- backup reminder ---- */
function backupAnchor(){ return (data.meta&&data.meta.lastBackup) || (data.meta&&data.meta.created) || Date.now(); }
function backupDue(){ return (Date.now()-backupAnchor()) >= 30*86400000; }
function daysSinceBackup(){
  const last=data.meta&&data.meta.lastBackup;
  if(!last) return null;
  return Math.floor((Date.now()-last)/86400000);
}
function updateBadge(){
  const b=document.getElementById("nav-badge");
  if(b) b.classList.toggle("on", backupDue());
}

/* ---- backup / restore ---- */
function exportData(){
  const blob=new Blob([JSON.stringify(data)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="routine-backup-"+todayKey()+".json";
  document.body.appendChild(a); a.click(); a.remove();
  data.meta.lastBackup=Date.now(); save();
  updateBadge(); if(tab==="settings") renderSettings();
  toast("Backup saved — reminder reset");
}
document.getElementById("import-file").addEventListener("change",e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ applyBackup(r.result); e.target.value=""; };
  r.readAsText(f);
});
function applyBackup(raw){
  try{
    const d=JSON.parse((raw||"").trim());
    if(!d || !Array.isArray(d.morning)) throw 0;
    data={ morning:d.morning||[], day:d.day||[], night:d.night||[], days:d.days||{}, meta:d.meta||{} };
    if(!data.meta.created) data.meta.created=Date.now();
    save(); closeSheet(); render(); updateBadge(); toast("Data restored");
  }catch(e){ toast("Couldn't read that backup"); }
}
function resetAll(){
  if(!confirm("Delete all routines, goals and history on this device? This can't be undone.")) return;
  data={ morning:[], day:[], night:[], days:{}, meta:{created:Date.now()} };
  localStorage.removeItem(STORE+"_seed");
  save(); render(); updateBadge(); toast("All data cleared");
}

/* ---- interactions ---- */
function toggle(id){
  const day=ensureDay(todayKey());
  day.done[tab][id]=!day.done[tab][id];
  day.ids[tab]=data[tab].map(x=>x.id);
  buzz(); save(); render();
}
function toggleEdit(){ editMode=!editMode; render(); }
function switchTab(t){
  tab=t; editMode=false;
  if(t==="cal") calMonth=new Date();
  document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x.dataset.tab===t));
  render(); window.scrollTo(0,0);
}

let editId=null;
function addItem(){ editId=null; openSheet("Add "+(tab==="day"?"goal":"task"),""); }
function editItem(id){ const it=data[tab].find(x=>x.id===id); if(!it)return; editId=id; openSheet("Edit",it.name); }
function openSheet(title,val){
  document.getElementById("sheet").innerHTML=`
    <h3>${title}</h3>
    <div class="field">
      <label>${tab==="day"?"Goal":"Task"}</label>
      <input id="inp" placeholder="${tab==="morning"?"e.g. Make the bed":tab==="day"?"e.g. Finish application":"e.g. Read 10 pages"}" value="${esc(val)}">
    </div>
    <div class="sheet-actions">
      ${editId?'<button class="btn-del" onclick="removeItem(editId)">Delete</button>':''}
      <button class="btn-primary" onclick="saveItem()">${editId?"Save":"Add"}</button>
    </div>`;
  document.getElementById("overlay").classList.add("open");
  setTimeout(()=>document.getElementById("inp").focus(),300);
}
function closeSheet(){ document.getElementById("overlay").classList.remove("open"); }
function saveItem(){
  const v=document.getElementById("inp").value.trim();
  if(!v){ document.getElementById("inp").focus(); return; }
  if(editId){ data[tab].find(x=>x.id===editId).name=v; }
  else { data[tab].push({id:uid(),name:v}); }
  save(); closeSheet(); render();
}
function removeItem(id){
  data[tab]=data[tab].filter(x=>x.id!==id);
  save(); closeSheet(); render();
}

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function esc(s){ return (s||"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function buzz(){ if(navigator.vibrate) navigator.vibrate(8); }
let toastT;
function toast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg; t.classList.add("show");
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),1900);
}

if(!data.morning.length && !data.day.length && !data.night.length && !localStorage.getItem(STORE+"_seed")){
  data.morning=[{id:uid(),name:"Make the bed"},{id:uid(),name:"Drink water"},{id:uid(),name:"Stretch"}];
  data.day=[{id:uid(),name:"Work / study block"},{id:uid(),name:"Move 30 min"}];
  data.night=[{id:uid(),name:"Plan tomorrow"},{id:uid(),name:"Read"}];
  localStorage.setItem(STORE+"_seed","1"); save();
}

if(!data.meta) data.meta={};
if(!data.meta.created){ data.meta.created=Date.now(); save(); }

let lastRenderDay=todayKey();
function refreshOnReturn(){
  // re-render so the date + daily checkboxes are fresh (e.g. after midnight)
  render(); updateBadge(); lastRenderDay=todayKey();
}
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) refreshOnReturn(); });
window.addEventListener("focus",refreshOnReturn);
window.addEventListener("pageshow",refreshOnReturn);
// safety net: check every minute for a day rollover while app stays open
setInterval(()=>{ if(todayKey()!==lastRenderDay) refreshOnReturn(); },60000);

render();
updateBadge();

if("serviceWorker" in navigator){ window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{})); }

</script>
</body>
</html>
